<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/conch.svg" />
    <title>Conch Predictor Series</title>

    <!-- SEO -->
    <meta
      name="description"
      content="Build private pools with friends and pick division winners, awards, Super Bowl champions, and over/under win totals in the Conch Predictor Series."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#061217" />
    <link rel="canonical" href="https://conchff.com/predictor/" />

    <!-- Open Graph / Facebook, Slack, iMessage, Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://conchff.com/predictor/" />
    <meta property="og:title" content="Conch Predictor Series" />
    <meta
      property="og:description"
      content="Build private pools with friends and pick division winners, awards, Super Bowl champions, and over/under win totals in the Conch Predictor Series."
    />
    <meta property="og:site_name" content="Conch Predictor Series" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:title" content="Conch Predictor Series" />
    <meta
      name="twitter:description"
      content="Build private pools with friends and pick division winners, awards, Super Bowl champions, and over/under win totals in the Conch Predictor Series."
    />

    <!-- TODO: share image. Drop a 1200x630 PNG at public/social-image.png and
         uncomment the block below. The URL must be absolute — Vite rewrites
         root-relative paths in this file to match VITE_BASE_PATH, but scrapers
         never resolve a relative og:image, so it stays hardcoded.
         Until it lands, link previews show title and description only. -->
    <!--
    <meta property="og:image" content="https://conchff.com/predictor/social-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Conch Predictor Series" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://conchff.com/predictor/social-image.png" />
    <meta name="twitter:image:alt" content="Conch Predictor Series" />
    -->

    <!-- Google tag (gtag.js) — same property as the host app so /predictor/
         traffic shows up alongside it. Page views come from src/lib/analytics.ts;
         see the note there before turning send_page_view back on. -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-551L2WPD3V"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-551L2WPD3V", { send_page_view: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
